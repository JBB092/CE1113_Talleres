CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_NUM_PREEMPT_PRIORITIES=8
CONFIG_MAIN_STACK_SIZE=1024

# Necesario para que k_thread_priority_get()/imprimir la prioridad
# efectiva del hilo BAJA sea observable mientras hereda la prioridad
# del hilo ALTA (ver Parte 2, modo MUTEX).
CONFIG_THREAD_NAME=y
