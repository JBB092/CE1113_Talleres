# Habilita printk/printf por UART (consola por defecto: uart0)
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

# Numero de prioridades cooperativas disponibles (usadas en este taller
# solo con prioridades preemptibles positivas, pero se dejan reservadas
# para la Parte 3 opcional).
CONFIG_NUM_COOP_PRIORITIES=4
CONFIG_NUM_PREEMPT_PRIORITIES=8

# Tamano razonable de stack para hilos que solo hacen printk + k_sleep
CONFIG_MAIN_STACK_SIZE=1024
